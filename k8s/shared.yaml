# ═══════════════════════════════════════════════════════════════════
# Shared Kubernetes Resources
# Namespace, ConfigMap, Secrets template, ServiceAccounts (IRSA)
# ═══════════════════════════════════════════════════════════════════

# ── Namespace ─────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    name: ecommerce
    environment: production

---
# ── ConfigMap: Shared non-sensitive configuration ─────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  AWS_REGION: "us-east-1"
  PRODUCTS_TABLE: "products"
  ORDERS_TABLE: "orders"
  PRODUCT_IMAGES_BUCKET: "ecommerce-product-images"
  ENVIRONMENT: "production"

---
# ── Secret: User Service sensitive config (populate before deploy) ──
# Replace base64 values with: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secrets
  namespace: ecommerce
type: Opaque
data:
  COGNITO_USER_POOL_ID: <BASE64_ENCODED_VALUE>
  COGNITO_CLIENT_ID: <BASE64_ENCODED_VALUE>
  COGNITO_CLIENT_SECRET: <BASE64_ENCODED_VALUE>

---
# ── ServiceAccount: User Service (IRSA) ───────────────────────────
# Annotate with IAM Role ARN for Cognito access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service-sa
  namespace: ecommerce
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/user-service-role

---
# ── ServiceAccount: Product Service (IRSA) ────────────────────────
# IAM Role needs: DynamoDB (products table) + S3 (product images bucket)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: ecommerce
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/product-service-role

---
# ── ServiceAccount: Order Service (IRSA) ──────────────────────────
# IAM Role needs: DynamoDB (orders table)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: ecommerce
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/order-service-role
